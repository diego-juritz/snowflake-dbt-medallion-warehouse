[project]
name = "snowflake-dbt-medallion-warehouse"
version = "1.0.0"
description = "Educational Snowflake + dbt Core Medallion warehouse with a tested star schema."
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Runtime dependencies are pinned in requirements.txt (the install path used
# by the README, Makefile, and CI). The helper scripts use only the stdlib.

[tool.ruff]
line-length = 120
target-version = "py310"
